[project]
name = "grid-agent"
version = "0.1.0"
description = "Grid reliability: Power BI report, outage model, and two Claude agents over U.S. outage data"
readme = "README.md"
authors = [
    { name = "Arnav Gupta", email = "65585272+arnavg03@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]   # so tests can import agent
